{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'index.css' %}">
    <title>Tech</title>
</head>
<body>
    <header>
        <img src="{% static 'assets/logo.png' %}" alt="Uma pessoa feliz no computador" class="logo">
    </header>
    <main>
        <h1>Autenticação com OAuth 2.0</h1>
        <div class="social-media">
            <div class="social-media-details">
                <a href="http://localhost:8000/accounts/github/login/?process=login">
                    <img class="social-media-icon" src="{% static 'assets/github.svg' %}" alt="Ícone para realizar a autenticação no GitHub">
                    <p>GitHub</p>
                </a>
            </div>
        </div>

    </main>
</body>
</html>
